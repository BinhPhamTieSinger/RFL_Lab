# GPU server: fixes for the failures found so far (report 8.2; predictions P70-P72). D1, D2, 30 clients alpha 0.5, 50 clients alpha 0.1; no attack, sign flip, backdoor, stealth backdoor, Min-Max.
# guard_agree (rewind only for two-signal isolations), r3wc_w5g6h20 (3 bad rounds in any 5, gate 6, high side 20), guard_v2 (both, and f never below half the starting count). Controls: the benchmark's r3wc, guard, r3wc_g6h20, guard_g6h20 (same run names). Written by scripts/make_followups.py. 180 runs.
seeds:
- 42
- 123
- 7
common:
  run.deterministic: true
  run.rounds: 30
  fedhep.exit_guard: true
  fedhep.head_agreement: true
