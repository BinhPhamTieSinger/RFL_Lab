# Acer (XPU), the high-side gate (report 8.2): FedHEP-Guard's union screen, but a client unusually CLOSE to the
# others (high side of the two-sided screen) counts only in rounds whose gap ratio reaches 20. The offline replay
# on 196 GPU runs showed backdoor attackers sit on the low side, colluding ALIE / Min-Max attackers on the high side
# in rounds with gap ratios of 30-130, and honest outliers on both sides. Predictions P33-P36.
# Controls on the Acer: x8_f3__*__r3wc, x10_a05__*__r3wc_shp, x11_a05__minmax3__r3wc, x13_n50a01__clean__r3wc,
# and acer_c14_control.yaml for the two conditions not run before.
# 7 conditions x 3 seeds = 21 runs (15 at 15 clients, 6 at 50 clients), about 10 hours; resumable.
seeds: [42, 123, 7]
common:
  run.rounds: 30
  fedhep.exit_guard: true
  fedhep.head_agreement: true
axes:
  - x14_a05__clean: {data.num_clients: 15, data.alpha: 0.5, plus.global_f: 3}
    x14_a05__backdoor3: {data.num_clients: 15, data.alpha: 0.5, plus.global_f: 3, attack.kind: backdoor, attack.count: 3}
    x14_a05__stealth3: {data.num_clients: 15, data.alpha: 0.5, plus.global_f: 3, attack.kind: stealth_backdoor,
                        attack.count: 3}
    x14_a05__alie3: {data.num_clients: 15, data.alpha: 0.5, plus.global_f: 3, attack.kind: alie,
                     attack.knowledge: colluders, attack.alie_z: 0.43, attack.count: 3}
    x14_a05__minmax3: {data.num_clients: 15, data.alpha: 0.5, plus.global_f: 3, attack.kind: min_max,
                       attack.knowledge: colluders, attack.count: 3}
    x14_n50a01__clean: {data.num_clients: 50, data.alpha: 0.1, plus.global_f: 10}
    x14_n50a01__backdoor10: {data.num_clients: 50, data.alpha: 0.1, plus.global_f: 10, attack.kind: backdoor,
                             attack.count: 10}
  - r3wc_hg20: {config: configs/cifar100_fedhep_defended.yaml, method: fedhep_plus, plus.reference: median,
                plus.regroup: true, plus.two_sided: true, plus.isolation_patience: 3, plus.exclusion_patience: 3,
                plus.global_rule: arc_nnm_tm, plus.gap_gate: 8, plus.signal: weights_critical, plus.high_gate: 20}
