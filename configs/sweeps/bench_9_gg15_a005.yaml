# Benchmark, setting 9 of 9: 15 clients, α 0.05 (paper) (15 clients, alpha 0.05, 3 attackers). Written by scripts/make_benchmark.py; edit that, not this file.
# 52 models x 8 conditions x 3 seeds = 1248 runs. GPU server only. Runs the large grid already made (same names) are skipped.
seeds:
- 42
- 123
- 7
common:
  run.deterministic: true
  run.rounds: 30
  fedhep.exit_guard: true
  fedhep.head_agreement: true
  data.num_clients: 15
axes:
- gg15_a005:
