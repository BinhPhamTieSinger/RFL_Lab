# GPU server, after the large grid: the stealth backdoor (rfl.attacks.adaptive.StealthBackdoorAttack) against the
# plain backdoor beyond D1: 15 and 30 clients, alpha 0.5 and 0.1, 20% attackers, f = true count. Adds the candidate
# method (R3 union screen + trunk-and-root rewind). 4 settings x 2 attacks x 7 methods x 3 seeds = 168 runs, about
# 3.5 hours on two GPUs. Methods innermost, so whole settings finish together.
seeds: [42, 123, 7]
common:
  run.deterministic: true
  run.rounds: 30
  fedhep.exit_guard: true
axes:
  - gs_n15a05: {data.num_clients: 15, data.alpha: 0.5, attack.count: 3, robust.assumed_attackers: 3, plus.global_f: 3}
    gs_n15a01: {data.num_clients: 15, data.alpha: 0.1, attack.count: 3, robust.assumed_attackers: 3, plus.global_f: 3}
    gs_n30a05: {data.num_clients: 30, data.alpha: 0.5, attack.count: 6, robust.assumed_attackers: 6, plus.global_f: 6}
    gs_n30a01: {data.num_clients: 30, data.alpha: 0.1, attack.count: 6, robust.assumed_attackers: 6, plus.global_f: 6}
  - backdoor: {attack.kind: backdoor}
    stealth: {attack.kind: stealth_backdoor}
  - fedhep: {config: configs/cifar100_fedhep.yaml}
    l0: {config: configs/cifar100_fedhep_defended.yaml, method: fedhep_robust, robust.rule: arc_nnm_tm}
    plus: {config: configs/cifar100_fedhep_defended.yaml, method: fedhep_plus, plus.reference: median,
           plus.regroup: true}
    r3w: &r3 {config: configs/cifar100_fedhep_defended.yaml, method: fedhep_plus, plus.reference: median,
              plus.regroup: true, plus.two_sided: true, plus.isolation_patience: 3, plus.exclusion_patience: 3,
              plus.global_rule: arc_nnm_tm, plus.gap_gate: 8, plus.signal: weights}
    r3wc: {<<: *r3, plus.signal: weights_critical}
    r3wc_tr: {<<: *r3, plus.signal: weights_critical, plus.rewind: trunk_root}
    flame: {config: configs/cifar100_fedhep_defended.yaml, method: fedhep_robust, robust.rule: flame}
