    plus.global_f: 4
  gg20_a02__noise4:
    data.num_clients: 20
    data.alpha: 0.2
    attack.kind: random_noise
    attack.count: 4
    robust.assumed_attackers: 4
    plus.global_f: 4
  gg20_a02__alie4:
    data.num_clients: 20
    data.alpha: 0.2
    attack.kind: alie
    attack.knowledge: colluders
    attack.alie_z: 0.385
    attack.count: 4
    robust.assumed_attackers: 4
    plus.global_f: 4
  gg20_a02__minmax4:
    data.num_clients: 20
