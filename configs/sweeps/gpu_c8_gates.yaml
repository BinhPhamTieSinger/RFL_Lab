# GPU server: r3wc_g6h20, guard_g6h20 in D1 and D2 before the benchmark reaches them. Written by scripts/make_benchmark.py. Same run names as bench_1/bench_2, so whichever runs first is kept.
# 2 settings x 8 conditions x 2 models x 3 seeds = 96 runs.
seeds:
- 42
- 123
- 7
common:
  run.deterministic: true
  run.rounds: 30
  fedhep.exit_guard: true
  fedhep.head_agreement: true
axes:
- gg15_a05__clean:
    data.num_clients: 15
    data.alpha: 0.5
    robust.assumed_attackers: 3
    plus.global_f: 3
  gg15_a05__sign3:
    data.num_clients: 15
    data.alpha: 0.5
    attack.kind: sign_flip
    attack.count: 3
    robust.assumed_attackers: 3
    plus.global_f: 3
  gg15_a05__label3:
    data.num_clients: 15
    data.alpha: 0.5
    attack.kind: label_flip
    attack.count: 3
    robust.assumed_attackers: 3
    plus.global_f: 3
  gg15_a05__noise3:
    data.num_clients: 15
    data.alpha: 0.5
    attack.kind: random_noise
    attack.count: 3
    robust.assumed_attackers: 3
    plus.global_f: 3
  gg15_a05__alie3:
    data.num_clients: 15
    data.alpha: 0.5
    attack.kind: alie
    attack.knowledge: colluders
    attack.alie_z: 0.431
    attack.count: 3
    robust.assumed_attackers: 3
    plus.global_f: 3
  gg15_a05__minmax3:
    data.num_clients: 15
    data.alpha: 0.5
    attack.kind: min_max
