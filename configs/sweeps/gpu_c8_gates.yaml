- r3wc_g6h20:
    config: configs/cifar100_fedhep_defended.yaml
    method: fedhep_plus
    plus.reference: median
    plus.regroup: true
    plus.two_sided: true
    plus.isolation_patience: 3
    plus.exclusion_patience: 3
    plus.global_rule: arc_nnm_tm
    plus.gap_gate: 6
    plus.signal: weights_critical
    plus.high_gate: 20
  guard_g6h20:
    config: configs/cifar100_fedhep_defended.yaml
    method: fedhep_plus
    plus.reference: median
    plus.regroup: true
    plus.two_sided: true
    plus.isolation_patience: 3
    plus.exclusion_patience: 3
    plus.global_rule: arc_nnm_tm
    plus.gap_gate: 6
    plus.signal: weights_critical
    plus.high_gate: 20
    plus.rewind: trunk_root
