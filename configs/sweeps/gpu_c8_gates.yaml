    attack.count: 3
    robust.assumed_attackers: 3
    plus.global_f: 3
  gg15_a05__stealth3:
    data.num_clients: 15
    data.alpha: 0.5
    attack.kind: stealth_backdoor
    attack.count: 3
    robust.assumed_attackers: 3
    plus.global_f: 3
  gg20_a02__clean:
    data.num_clients: 20
    data.alpha: 0.2
    robust.assumed_attackers: 4
    plus.global_f: 4
  gg20_a02__sign4:
    data.num_clients: 20
    data.alpha: 0.2
    attack.kind: sign_flip
    attack.count: 4
    robust.assumed_attackers: 4
