# GPU server: the global step's assumed attacker count held at 20% of the clients however many are isolated (plus.global_f_fixed; literature review Part 4; predictions P62-P63). 50 clients, alpha 0.1 and 0.5;
# no attack, backdoor, stealth backdoor; union screen and FedHEP-Guard. The benchmark holds the same models with the shrinking count. Written by scripts/make_followups.py. 36 runs.
seeds:
- 42
- 123
- 7
common:
  run.deterministic: true
  run.rounds: 30
  fedhep.exit_guard: true
  fedhep.head_agreement: true
axes:
- gg50_a01__clean:
    data.num_clients: 50
    data.alpha: 0.1
    robust.assumed_attackers: 10
    plus.global_f: 10
  gg50_a01__backdoor10:
    data.num_clients: 50
    data.alpha: 0.1
    attack.kind: backdoor
    attack.count: 10
    robust.assumed_attackers: 10
    plus.global_f: 10
  gg50_a01__stealth10:
    data.num_clients: 50
    data.alpha: 0.1
    attack.kind: stealth_backdoor
    attack.count: 10
    robust.assumed_attackers: 10
    plus.global_f: 10
  gg50_a05__clean:
    data.num_clients: 50
    data.alpha: 0.5
    robust.assumed_attackers: 10
    plus.global_f: 10
  gg50_a05__backdoor10:
    data.num_clients: 50
    data.alpha: 0.5
    attack.kind: backdoor
    attack.count: 10
    robust.assumed_attackers: 10
    plus.global_f: 10
  gg50_a05__stealth10:
    data.num_clients: 50
    data.alpha: 0.5
    attack.kind: stealth_backdoor
    attack.count: 10
    robust.assumed_attackers: 10
    plus.global_f: 10
- r3wc_ffixed:
    config: configs/cifar100_fedhep_defended.yaml
    method: fedhep_plus
    plus.reference: median
    plus.regroup: true
    plus.two_sided: true
    plus.isolation_patience: 3
    plus.exclusion_patience: 3
    plus.global_rule: arc_nnm_tm
    plus.gap_gate: 8
    plus.signal: weights_critical
    plus.global_f_fixed: true
  guard_ffixed:
    config: configs/cifar100_fedhep_defended.yaml
    method: fedhep_plus
    plus.reference: median
    plus.regroup: true
    plus.two_sided: true
    plus.isolation_patience: 3
    plus.exclusion_patience: 3
    plus.global_rule: arc_nnm_tm
    plus.gap_gate: 8
    plus.signal: weights_critical
    plus.rewind: trunk_root
    plus.global_f_fixed: true
