# Follow-up (2026-11-13, professor's request): 20 clients (same 10,000 training images), 3 parents, alpha = 0.5,
# 5 / 7 attackers of 20 (25% / 35%), backdoor. No-defense baselines (FedAvg, undefended
# FedHEP) vs Defended FedHEP vs FedHEP+ vs FLAME. Bulyan is left out: it needs n >= 4f + 3.
# 30 runs, about 6 h.
#   caffeinate -i python scripts/sweep.py configs/sweeps/followup_n20_backdoor.yaml
seeds: [42, 123, 7]
common:
  data.alpha: 0.5
  data.num_clients: 20
  run.rounds: 30
axes:
  - n20__fedavg: {config: configs/cifar100_fedavg.yaml}
    n20__fedhep: {config: configs/cifar100_fedhep.yaml}
    n20__defended: {config: configs/cifar100_fedhep_defended.yaml}
    n20__plus: {config: configs/cifar100_fedhep_defended.yaml, method: fedhep_plus, plus.reference: median,
              plus.regroup: true}
    n20__flame: {config: configs/cifar100_fedhep_defended.yaml, method: fedhep_robust, robust.rule: flame}
  - backdoor5: {attack.kind: backdoor, attack.count: 5}
    backdoor7: {attack.kind: backdoor, attack.count: 7}
