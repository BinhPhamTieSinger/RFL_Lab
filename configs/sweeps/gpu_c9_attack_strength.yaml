# GPU server: attack strength (literature review Part 2, experiment 3; predictions P44-P47). D1 and D2; ALIE z 1 / 1.5 / 3 (colluders), IPM epsilon 0.5 / 2 / n (omniscient), Min-Max along the inverse unit vector and the inverse sign (omniscient).
# Written by scripts/make_followups.py. 2 settings x 8 attacks x 8 models x 3 seeds = 384 runs. The benchmark holds the bounded versions (formula z, inverse std) and the no-attack runs.
