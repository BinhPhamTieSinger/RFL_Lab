# Campaign stage C5, recovery after detection (H8, predictions P8-P10). When a client is isolated, the shared
# model goes back to the stored Global model from before that client's first suspicious round (plus.rewind:
# which coordinates). On the root-head signal (r3) the backdoor attackers are isolated in some seeds only, so the
# whole-update signal (r3w) is included; the no-rewind baselines are g1__r3 and g1__r3w in gpu_d1_signals.
# Backdoor on all 30 rounds, and stopped after round 10 (does the rewind also remove what was implanted before
# the attackers went quiet).
# GPU server. 36 runs.
seeds: [42, 123, 7]
common:
  run.deterministic: true      # identical reruns on the GPU server (pilot: CUDA otherwise varies run to run)
  data.alpha: 0.5
  run.rounds: 30
  fedhep.exit_guard: true
  fedhep.head_agreement: true
axes:
  - c5__r3_trunk: &r3 {config: configs/cifar100_fedhep_defended.yaml, method: fedhep_plus, plus.reference: median,
                 plus.regroup: true, plus.two_sided: true, plus.isolation_patience: 3, plus.exclusion_patience: 3,
                 plus.global_rule: arc_nnm_tm, plus.global_f: 3, plus.gap_gate: 8, plus.rewind: trunk}
    c5__r3_tr: {<<: *r3, plus.rewind: trunk_root}
    c5__r3_all: {<<: *r3, plus.rewind: all}
    c5__r3w_trunk: {<<: *r3, plus.signal: weights}
    c5__r3w_tr: {<<: *r3, plus.signal: weights, plus.rewind: trunk_root}
    c5__r3w_all: {<<: *r3, plus.signal: weights, plus.rewind: all}
  - backdoor3: {attack.kind: backdoor, attack.count: 3}
    backdoor3_stop10: {attack.kind: backdoor, attack.count: 3, attack.stop_round: 10}
