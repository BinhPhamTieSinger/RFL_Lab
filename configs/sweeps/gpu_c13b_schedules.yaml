# GPU server: the timed attacks that beat every isolation rule on the Acer (report 8.2), at four settings: backdoor 2 rounds on, 1 off; backdoor from round 10.
# Controls r3wc, guard, r3wc_g6h20 in the same sweep; fixes guard_agree, r3wc_w5g6h20, guard_v2 (P72). Written by scripts/make_followups.py. 144 runs.
seeds:
- 42
- 123
- 7
common:
  run.deterministic: true
  run.rounds: 30
  fedhep.exit_guard: true
  fedhep.head_agreement: true
