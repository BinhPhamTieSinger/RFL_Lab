# Follow-up (2026-11-12, professor's request): a larger federation and many more attackers.
# 30 clients (same 10,000 training images, so ~333 each), 3 parents, alpha = 0.5, attackers = 6 / 9 / 12 of 30
# (20 / 30 / 40%), sign flip and backdoor. No-defense baselines (FedAvg, undefended FedHEP) vs Defended FedHEP vs
# FedHEP+ vs FLAME. Bulyan is left out: it needs n >= 4f + 3 (f = 12 would need 51 clients).
# 105 runs, about 14 h. Run last; it is independent of the other follow-up sweeps.
#   caffeinate -i python scripts/sweep.py configs/sweeps/followup_scale.yaml
seeds: [42, 123, 7]
common:
  data.alpha: 0.5
  data.num_clients: 30
  run.rounds: 30
axes:
  - scale__fedavg: {config: configs/cifar100_fedavg.yaml}
    scale__fedhep: {config: configs/cifar100_fedhep.yaml}
    scale__defended: {config: configs/cifar100_fedhep_defended.yaml}
    scale__plus: {config: configs/cifar100_fedhep_defended.yaml, method: fedhep_plus, plus.reference: median,
                  plus.regroup: true}
    scale__flame: {config: configs/cifar100_fedhep_defended.yaml, method: fedhep_robust, robust.rule: flame}
  - clean: {}
    sign6: {attack.kind: sign_flip, attack.count: 6}
    sign9: {attack.kind: sign_flip, attack.count: 9}
    sign12: {attack.kind: sign_flip, attack.count: 12}
    backdoor6: {attack.kind: backdoor, attack.count: 6}
    backdoor9: {attack.kind: backdoor, attack.count: 9}
    backdoor12: {attack.kind: backdoor, attack.count: 12}
