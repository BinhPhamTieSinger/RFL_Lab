# Large GPU grid, 50 clients (written by scripts/make_gpu_grid.py; edit that, not this file).
# 8 methods x alpha 0.1 / 0.5 x (clean + 4 attacks x 3 attacker counts (5, 10, 15)) x 3 seeds = 624 runs. GPU server only.
seeds:
- 42
- 123
- 7
common:
  run.deterministic: true
  data.num_clients: 50
  run.rounds: 30
  fedhep.exit_guard: true
  fedhep.head_agreement: true
axes:
- gg50_a01:
    data.alpha: 0.1
  gg50_a05:
    data.alpha: 0.5
- clean:
    robust.assumed_attackers: 10
    plus.global_f: 10
  sign5:
    attack.kind: sign_flip
    attack.count: 5
    robust.assumed_attackers: 5
    plus.global_f: 5
  alie5:
    attack.kind: alie
    attack.knowledge: colluders
    attack.alie_z: 0.202
    attack.count: 5
    robust.assumed_attackers: 5
    plus.global_f: 5
  minmax5:
    attack.kind: min_max
    attack.knowledge: omniscient
    attack.count: 5
    robust.assumed_attackers: 5
    plus.global_f: 5
  backdoor5:
    attack.kind: backdoor
    attack.count: 5
    robust.assumed_attackers: 5
    plus.global_f: 5
  sign10:
    attack.kind: sign_flip
    attack.count: 10
    robust.assumed_attackers: 10
    plus.global_f: 10
  alie10:
    attack.kind: alie
    attack.knowledge: colluders
    attack.alie_z: 0.468
    attack.count: 10
    robust.assumed_attackers: 10
    plus.global_f: 10
  minmax10:
    attack.kind: min_max
    attack.knowledge: omniscient
    attack.count: 10
    robust.assumed_attackers: 10
    plus.global_f: 10
  backdoor10:
    attack.kind: backdoor
    attack.count: 10
    robust.assumed_attackers: 10
    plus.global_f: 10
  sign15:
    attack.kind: sign_flip
    attack.count: 15
    robust.assumed_attackers: 15
    plus.global_f: 15
  alie15:
    attack.kind: alie
    attack.knowledge: colluders
    attack.alie_z: 0.772
    attack.count: 15
    robust.assumed_attackers: 15
    plus.global_f: 15
  minmax15:
    attack.kind: min_max
    attack.knowledge: omniscient
    attack.count: 15
    robust.assumed_attackers: 15
    plus.global_f: 15
  backdoor15:
    attack.kind: backdoor
    attack.count: 15
    robust.assumed_attackers: 15
    plus.global_f: 15
- fedhep:
    config: configs/cifar100_fedhep.yaml
  defended:
    config: configs/cifar100_fedhep_defended.yaml
  plus:
    config: configs/cifar100_fedhep_defended.yaml
    method: fedhep_plus
    plus.reference: median
    plus.regroup: true
  l0:
    config: configs/cifar100_fedhep_defended.yaml
    method: fedhep_robust
    robust.rule: arc_nnm_tm
  r3:
    config: configs/cifar100_fedhep_defended.yaml
    method: fedhep_plus
    plus.reference: median
    plus.regroup: true
    plus.two_sided: true
    plus.isolation_patience: 3
    plus.exclusion_patience: 3
    plus.global_rule: arc_nnm_tm
    plus.gap_gate: 8
  r3w:
    config: configs/cifar100_fedhep_defended.yaml
    method: fedhep_plus
    plus.reference: median
    plus.regroup: true
    plus.two_sided: true
    plus.isolation_patience: 3
    plus.exclusion_patience: 3
    plus.global_rule: arc_nnm_tm
    plus.gap_gate: 8
    plus.signal: weights
  r3wc:
    config: configs/cifar100_fedhep_defended.yaml
    method: fedhep_plus
    plus.reference: median
    plus.regroup: true
    plus.two_sided: true
    plus.isolation_patience: 3
    plus.exclusion_patience: 3
    plus.global_rule: arc_nnm_tm
    plus.gap_gate: 8
    plus.signal: weights_critical
  flame:
    config: configs/cifar100_fedhep_defended.yaml
    method: fedhep_robust
    robust.rule: flame
