# Acer (XPU), the acer_c17 fixes at 50 clients, alpha 0.1, no attack (P69): where honest isolations are worst, what
# do the window and the single-signal sentence cost or give back? Controls: x13_n50a01__clean__r3wc (22.3 honest
# isolated per run), x15_n50a01__clean__r3wc_g6h20 (21.3), x16_n50a01__clean__r3wc_s5 (20.0).
# Run after acer_c17_fixes.yaml. 3 models x 3 seeds = 9 runs, about 8 hours; resumable.
seeds: [42, 123, 7]
common:
  run.rounds: 30
  fedhep.exit_guard: true
  fedhep.head_agreement: true
axes:
  - x17_n50a01__clean: {data.num_clients: 50, data.alpha: 0.1, plus.global_f: 10}
  - r3wc_w5: &r3wc {config: configs/cifar100_fedhep_defended.yaml, method: fedhep_plus, plus.reference: median,
                    plus.regroup: true, plus.two_sided: true, plus.isolation_patience: 3,
                    plus.exclusion_patience: 3, plus.global_rule: arc_nnm_tm, plus.gap_gate: 8,
                    plus.signal: weights_critical, plus.isolation_window: 5}
    r3wc_w5g6h20: {<<: *r3wc, plus.gap_gate: 6, plus.high_gate: 20}
    r3wc_ss: {<<: *r3wc, plus.isolation_window: 0, plus.sentence: 5, plus.max_strikes: 2,
              plus.sentence_single: true}
