# Acer (XPU), the low-side gate (report 8.2): acer_c14_high_gate.yaml with the gap gate lowered from 8 to 6, so a
# client unusually FAR from the others (low side) counts in rounds whose gap ratio reaches 6; the high side still
# needs 20. Same conditions, seeds and names (x15_ for x14_) as c14, so every run has a paired control on the same
# seed. In c14 the stealth backdoor got through on seeds 123 and 7 (71%, 57%); replaying this rule on those runs'
# logs isolates all three attackers in rounds 3-6. Predictions P41-P43.
# 6 conditions x 3 seeds = 18 runs (15 at 15 clients, 3 at 50 clients), about 8 hours; resumable.
seeds: [42, 123, 7]
common:
  run.rounds: 30
  fedhep.exit_guard: true
  fedhep.head_agreement: true
axes:
  - x15_a05__clean: {data.num_clients: 15, data.alpha: 0.5, plus.global_f: 3}
    x15_a05__backdoor3: {data.num_clients: 15, data.alpha: 0.5, plus.global_f: 3, attack.kind: backdoor, attack.count: 3}
    x15_a05__stealth3: {data.num_clients: 15, data.alpha: 0.5, plus.global_f: 3, attack.kind: stealth_backdoor,
                        attack.count: 3}
    x15_a05__alie3: {data.num_clients: 15, data.alpha: 0.5, plus.global_f: 3, attack.kind: alie,
                     attack.knowledge: colluders, attack.alie_z: 0.43, attack.count: 3}
    x15_a05__minmax3: {data.num_clients: 15, data.alpha: 0.5, plus.global_f: 3, attack.kind: min_max,
                       attack.knowledge: colluders, attack.count: 3}
    x15_n50a01__clean: {data.num_clients: 50, data.alpha: 0.1, plus.global_f: 10}
  - r3wc_g6h20: {config: configs/cifar100_fedhep_defended.yaml, method: fedhep_plus, plus.reference: median,
                 plus.regroup: true, plus.two_sided: true, plus.isolation_patience: 3, plus.exclusion_patience: 3,
                 plus.global_rule: arc_nnm_tm, plus.gap_gate: 6, plus.signal: weights_critical, plus.high_gate: 20}
