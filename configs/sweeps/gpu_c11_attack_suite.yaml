# GPU server: the rest of the attack suite and the attack schedules (literature review Part 3; predictions P57-P61). D1 and D2; Min-Sum, Fang's trimmed-mean attack (full and partial knowledge), PoisonedFL, XFED;
# sign flip in 2-round bursts (2 on, 1 off) and from round 10 (sleeper); backdoor in 2-round bursts. Written by scripts/make_followups.py. 2 settings x 8 conditions x 8 models x 3 seeds = 384 runs.
seeds:
- 42
- 123
- 7
common:
  run.deterministic: true
  run.rounds: 30
  fedhep.exit_guard: true
  fedhep.head_agreement: true
axes:
