# Mac (MPS) version of campaign stage C5, recovery after detection (H8). p6__r3g8__backdoor is the no-rewind
# baseline on the root-head signal; m6__r3w__backdoor3 (added here) is the no-rewind baseline on the whole-update
# signal. 42 runs, about 9 hours.
seeds: [42, 123, 7]
common:
  data.alpha: 0.5
  run.rounds: 30
  fedhep.exit_guard: true
  fedhep.head_agreement: true
axes:
  - m6__r3_trunk: &r3 {config: configs/cifar100_fedhep_defended.yaml, method: fedhep_plus, plus.reference: median,
                 plus.regroup: true, plus.two_sided: true, plus.isolation_patience: 3, plus.exclusion_patience: 3,
                 plus.global_rule: arc_nnm_tm, plus.global_f: 3, plus.gap_gate: 8, plus.rewind: trunk}
    m6__r3_tr: {<<: *r3, plus.rewind: trunk_root}
    m6__r3_all: {<<: *r3, plus.rewind: all}
    m6__r3w_trunk: {<<: *r3, plus.signal: weights}
    m6__r3w_tr: {<<: *r3, plus.signal: weights, plus.rewind: trunk_root}
    m6__r3w_all: {<<: *r3, plus.signal: weights, plus.rewind: all}
    m6__r3w: {<<: *r3, plus.signal: weights, plus.rewind: none}
  - backdoor3: {attack.kind: backdoor, attack.count: 3}
    backdoor3_stop10: {attack.kind: backdoor, attack.count: 3, attack.stop_round: 10}
