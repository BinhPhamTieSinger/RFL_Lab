# First batch on the lab GPU server (4 x RTX PRO 4500; first planned for an A1000). Every screening signal on top
# of rung R3, with fresh baselines, on D1 (alpha 0.5, 15 clients, 3 attackers). Results from this server cannot be
# compared with Mac (MPS) or Acer (XPU) runs, so the baselines are rerun here. Signals: root_head (R3 as on the
# Mac), weights (whole update; 0.3% backdoor success in Phase 3 seed 42), critical (most disputed layers, after
# FedSurrogate), sign_align (AlignIns MPSA), probe_logits and head_gap (outputs on 200 probe images). The
# depth-exit guard (fedhep.exit_guard) is on everywhere: it is evaluation-only, so every main metric is unchanged
# and each run also records guarded accuracy, backdoor success and the clean flag rate. Run on the GPU server only.
# 150 runs; run the pilot first (see OPERATIONS.md).
seeds: [42, 123, 7]
common:
  data.alpha: 0.5
  run.rounds: 30
  fedhep.exit_guard: true
  fedhep.head_agreement: true   # idea 9, evaluation only (prediction P11); main metrics unchanged
axes:
  - g1__fedhep: {config: configs/cifar100_fedhep.yaml}
    g1__defended: {config: configs/cifar100_fedhep_defended.yaml}
    g1__plus: {config: configs/cifar100_fedhep_defended.yaml, method: fedhep_plus, plus.reference: median,
               plus.regroup: true}
    g1__l0: {config: configs/cifar100_fedhep_defended.yaml, method: fedhep_robust, robust.rule: arc_nnm_tm,
             robust.assumed_attackers: 3}
    g1__r3: &r3 {config: configs/cifar100_fedhep_defended.yaml, method: fedhep_plus, plus.reference: median,
                 plus.regroup: true, plus.two_sided: true, plus.isolation_patience: 3, plus.exclusion_patience: 3,
                 plus.global_rule: arc_nnm_tm, plus.global_f: 3, plus.gap_gate: 8}
    g1__r3w: {<<: *r3, plus.signal: weights}
    g1__r3c: {<<: *r3, plus.signal: critical}
    g1__r3s: {<<: *r3, plus.signal: sign_align}
    g1__r3p: {<<: *r3, plus.signal: probe_logits}
    g1__r3h: {<<: *r3, plus.signal: head_gap}
  - clean: {}
    sign3: {attack.kind: sign_flip, attack.count: 3}
    backdoor3: {attack.kind: backdoor, attack.count: 3}
    alie3: {attack.kind: alie, attack.count: 3, attack.knowledge: colluders, attack.alie_z: 0.43}
    minmax3: {attack.kind: min_max, attack.count: 3, attack.knowledge: omniscient}
