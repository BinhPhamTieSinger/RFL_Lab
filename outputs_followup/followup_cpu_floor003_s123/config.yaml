name: followup_cpu_floor003
method: fedhep_plus
model: resnet9_multihead
data:
  dataset: cifar100
  root: ../Paper_Reproduction/data
  train_subset: 600
  test_subset: 300
  num_clients: 15
  alpha: 0.5
train:
  local_epochs: 1
  batch_size: 32
  lr: 0.05
  min_lr: 0.001
  momentum: 0.9
  nesterov: true
  weight_decay: 0.0001
run:
  rounds: 30
  eval_every: 10
  seed: 123
  device: auto
  output_dir: outputs_followup
fedhep:
  num_groups: 3
  similarity_on: full
attack:
  kind: null
  knowledge: colluders
  alie_z: 1.0
  rate: 0.0
  count: null
  placement: random
  backdoor_target: 0
  backdoor_fraction: 0.5
  scale: 1.0
plus:
  signal: root_head
  reference: median
  z_cut: 2.5
  evidence_cut: 1.5
  evidence_decay: 0.7
  regroup: true
  readmit: false
  max_excluded: 1.0
  population: kept
  drill_down: false
  group_cut: 2.0
  drill_cut: 1.0
  drill_mode: exclude
  min_group: 2
  mad_floor: 0.03
  relative_floor: 0.1
  isolation_patience: 1
  exclusion_patience: 1
robust:
  rule: median
  assumed_attackers: 3
  flame_lambda: 0.001
  flame_on: models
  root_size: 100
baseline:
  fedprox_mu: 0.01
  ditto_lambda: 0.05
  krum_selected: 3
  fedrep_head_epochs: 1
