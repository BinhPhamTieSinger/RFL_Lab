[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfl-lab"
version = "0.1.0"
description = "Modular framework for robust federated learning experiments (FedHEP and successors)"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "torchvision>=0.17", "numpy>=1.24", "pyyaml>=6.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
# Checkers are pinned: their verdicts change between versions, so every machine must run the same ones.
dev = ["pytest>=8", "hypothesis==6.170.14", "ruff==0.17.4", "mypy==2.4.1", "import-linter==2.15", "graphifyy>=0.9",
       "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 115
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

# The architecture rule, checked by `lint-imports`: a package may import only from layers below it.
# Packages separated by "|" sit on the same layer and may not import each other.
[tool.importlinter]
root_package = "rfl"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "rfl.experiment",
    "rfl.server",
    "rfl.client | rfl.grouping | rfl.defense | rfl.aggregation | rfl.evaluation",
    "rfl.models | rfl.data | rfl.attacks",
    "rfl.core",
]
