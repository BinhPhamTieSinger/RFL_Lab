name: p3b__zmr_ra_cap__clean
method: fedhep_plus
model: resnet9_multihead
data:
  dataset: cifar100
  root: ../Paper_Reproduction/data
  train_subset: 10000
  test_subset: 3000
  num_clients: 15
  alpha: 0.5
train:
  local_epochs: 5
  batch_size: 32
  lr: 0.05
  min_lr: 0.001
  momentum: 0.9
  nesterov: true
  weight_decay: 0.0001
run:
  rounds: 30
  eval_every: 5
  seed: 7
  device: auto
  output_dir: outputs
fedhep:
  num_groups: 3
  similarity_on: full
attack:
  kind: null
  rate: 0.0
  count: null
  placement: random
  backdoor_target: 0
  backdoor_fraction: 0.5
  scale: 1.0
plus:
  signal: root_head
  reference: median
  z_cut: 2.5
  evidence_cut: 1.5
  evidence_decay: 0.7
  regroup: true
  readmit: true
  max_excluded: 0.34
baseline:
  fedprox_mu: 0.01
  ditto_lambda: 0.05
  krum_selected: 3
  fedrep_head_epochs: 1
