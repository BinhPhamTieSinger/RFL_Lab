name: p5__flame_upd__noise
method: fedhep_robust
model: resnet9_multihead
data:
  dataset: cifar100
  root: ../Paper_Reproduction/data
  train_subset: 10000
  test_subset: 3000
  num_clients: 15
  alpha: 0.5
train:
  local_epochs: 5
  batch_size: 32
  lr: 0.05
  min_lr: 0.001
  momentum: 0.9
  nesterov: true
  weight_decay: 0.0001
run:
  rounds: 30
  eval_every: 5
  seed: 7
  device: auto
  output_dir: outputs
fedhep:
  num_groups: 3
  similarity_on: full
attack:
  kind: random_noise
  rate: 0.0
  count: 3
  placement: random
  backdoor_target: 0
  backdoor_fraction: 0.5
  scale: 1.0
plus:
  signal: root_head
  reference: mean_direction
  z_cut: 2.5
  evidence_cut: 1.5
  evidence_decay: 0.7
  regroup: false
  readmit: false
  max_excluded: 1.0
  population: kept
  drill_down: false
  group_cut: 2.0
  drill_cut: 1.0
  drill_mode: exclude
  min_group: 2
robust:
  rule: flame
  assumed_attackers: 3
  flame_lambda: 0.001
  flame_on: updates
  root_size: 100
baseline:
  fedprox_mu: 0.01
  ditto_lambda: 0.05
  krum_selected: 3
  fedrep_head_epochs: 1
